<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Item Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Item Manager</h1>

    <section class="card">
      <h2 id="form-title">Add Item</h2>
      <form id="item-form" novalidate>
        <div class="form-row">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" maxlength="100" autocomplete="off" required />
        </div>
        <div class="form-row">
          <label for="price">Price</label>
          <input type="number" id="price" name="price" min="0" step="any" required />
        </div>
        <p id="message" class="message" role="alert" aria-live="polite"></p>
        <div class="form-actions">
          <button type="button" id="cancel-btn" class="btn btn-secondary" hidden>Cancel</button>
          <button type="submit" id="submit-btn" class="btn btn-primary">Submit</button>
        </div>
      </form>
    </section>

    <section class="card">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="items-body"></tbody>
      </table>
      <p id="empty-state" class="empty" hidden>No items yet. Add one above.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
